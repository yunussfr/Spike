[project]
name = "snn-affect"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["torch", "numpy", "pyyaml", "matplotlib", "neurobench"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# GPU (CUDA) destekli torch için PyTorch'un kendi paket sunucusu
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]