# Tavan ve kayıp ölçümü (experiments/ceiling.py): aynı veride Wiener filtresi, GRU (BPTT) ve
# rezervuar r'si üzerinde ridge, NLMS okumayla karşılaştırılır (KR-033). Rapor seed'leri, test raporlanır;
# tüm seçimler (λ, H, gizli boyut, erken durdurma) yalnızca val'de yapılır.
base: nhp_motor.yaml

experiment:
  name: ceiling
  device: auto             # GRU GPU'da; Wiener CPU'da

ceiling:
  ref_run: runs/20261030-101907_nhp_motor_full_seeds0-1-2-3-4   # (c) ridge-r ve NLMS (A) test R²'si buradan okunur
  wiener:
    history: [1, 5, 10, 20]   # H: son H adımın (20 ms kutu) ham sayımları; (a) = H 10, ayrıca val'de seçilen H
    report_h: 10
  gru:
    hidden_grid: [128, 256]   # val'de seçilir (seed başına)
    num_layers: 1
    input_dropout: 0.2
    lr: 2.0e-3
    weight_decay: 1.0e-5
    grad_clip: 1.0
    streams: 16              # train dizisi bu kadar ardışık akışa bölünür (TBPTT batch'i)
    chunk: 50                # BPTT uzunluğu, adım (1 s); gizli durum akış içinde taşınır, kesilir
    max_epochs: 150
    patience: 15             # val R² bu kadar tur iyileşmezse durur; en iyi val durumu geri yüklenir
