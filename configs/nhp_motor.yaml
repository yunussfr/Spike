# Faz 3–4: NeuroBench primat motor tahmini (parmak ucu hızı, 2B regresyon).
base: base.yaml

experiment:
  name: nhp_motor
  device: cpu              # B=1 adım adım akışta CPU (1 iş parçacığı) GPU’dan hızlı: 4 vs 10 ms/adım
  tune_seed: 100           # yalnızca doğrulama ayarı için; rapor seed'lerinden ayrı

encoder:
  level:
    range: train_per_channel   # kanal başına ölçek yalnızca train'den (ARCHITECTURE.md §3.1)

data:
  dir: data/primate
  cache_dir: data/primate/cache
  files:                   # NeuroBench sırası; 6 oturum
    - indy_20170131_02
    - indy_20160630_01
    - indy_20160622_01
    - loco_20170301_05
    - loco_20170215_02
    - loco_20170210_03
  bin_width: 0.02          # s; 20 ms = T·dt (bir ortam adımı)
  stride: 0.02             # s; örtüşmesiz kutular
  train_ratio: 0.8         # NeuroBench: segmentlerin %80 train, kalan yarı yarıya val/test
  biological_delay: 0      # adım; spike → hareket gecikmesi
  scale_percentile: 99.0   # kanal ölçeği: train'deki sayımların bu yüzdeliği → 1.0

nhp:
  configs: [A, B, B+Z]
  washout: 15              # 3·τ / (T·dt), τ = 100 ms; öğrenme ve okuma dışı
  epochs: 12               # train üzerinde tur sayısı; val: 1→0,33, 3→0,34, 12→0,38, 24→0,38, 48→0,38
  max_steps: null          # duman koşusu için oturumu kısaltır
  ridge_grid: [1.0e-1, 1.0, 10.0, 100.0, 1.0e+3, 1.0e+4, 1.0e+5]
  stage2_device: cpu       # batch'li okuma: oturum başına CPU süreci; GPU Windows'ta adım başına ~3 ms tabanı (KR-022)
  chunk: 4096              # r diskten bu kadar satırlık parçalarla okunur

decision:
  norm_rate: 0.0003        # val: 0,01 → 0,28; 0,001 → 0,34; 0,0003 → 0,38 (12 tur)

regtrial:                  # Faz 5 deneme koşusu (experiments/regulator_trial.py); yalnızca ayar seed'i ve val
  configs: [B+Z, C:hand, C:perturb]   # C:<mod> → agent.config C, regulators.enabled, regulators.mode
  epochs: 1
  max_steps: 20000         # oturumu kısaltır (null → tam oturum)

regulators:
  perturbation:
    noise_std: 0.1         # σ: ayar seed'i 100, Indy val'de seçildi (KR-025); 0,01 ile W_r neredeyse hiç değişmiyordu

faz5:                      # Faz 5 çıkış koşusu (experiments/faz5_full.py); rapor seed'leri, test raporlanır
  configs: [A, B, B+Z, "C:perturb+EMR"]   # C: E okuyan sürüm (KR-030); "C:perturb" z okuyan sürüm
  epochs: 3                # tüm konfigürasyonlar aynı tur sayısıyla (Faz 3–4'teki 12 tur değil)
  max_steps: null          # duman koşusu için oturumu kısaltır
  trace_every: 10          # C izleri (g, τ, η, β, E) her 10 adımda bir kaydedilir

faz6:                      # Faz 6 deneme koşusu (experiments/faz6_trial.py); ayar seed'leri, yalnızca val (KR-031)
  train: [B+Z, "C:perturb+EMR", "C:perturb+EMR+anchor"]   # her biri bir kez eğitilir; "+anchor" çapa alt-popülasyonunu açar
  anchor_frac: 0.2         # "+anchor" eğitimlerinde reservoir.anchor_frac
  variants:                # ad: [eğitilen konfigürasyon, val modu]; mod: frozen (Faz 5) | fixed | modulated
    "B+Z F5 donuk": [B+Z, frozen]
    "B+Z F6 sabit η": [B+Z, fixed]
    "C F5 donuk": ["C:perturb+EMR", frozen]
    "C F6 sabit η": ["C:perturb+EMR", fixed]
    "C F6 η_t": ["C:perturb+EMR", modulated]
    "C+çapa F6 η_t": ["C:perturb+EMR+anchor", modulated]   # opsiyonel: %20 nöron τ = 100'de sabit
  epochs: 3
  max_steps: 20000         # KR-029/030 ile aynı kısaltma
