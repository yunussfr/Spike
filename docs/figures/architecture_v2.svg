<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEA"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="affect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#92400E"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#F59E0B"/>

  <text x="40" y="52" font-size="28" font-weight="700" fill="#422006">Spike v2 — sürpriz kapılı çevrimiçi uyum</text>
  <text x="40" y="78" font-size="14" fill="#78350F">Çevrimdışı eğitilen spike omurgası · çevrimiçi yalnızca yerel kurallar · duygu uzayı "ne zaman uyum sağla" kararını verir</text>

  <!-- ana veri akışı -->
  <g font-size="13" fill="#422006">
    <rect x="30" y="105" width="165" height="110" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="112" y="140" text-anchor="middle" font-weight="700">Elektrot spike'ları</text>
    <text x="112" y="162" text-anchor="middle">x(t), 4 ms adım</text>
    <text x="112" y="182" text-anchor="middle" fill="#78350F">Indy 96 / Loco 192 kanal</text>

    <rect x="225" y="105" width="165" height="110" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="307" y="140" text-anchor="middle" font-weight="700">Kodlayıcı</text>
    <text x="307" y="162" text-anchor="middle">Anscombe + kanal z-skoru</text>
    <text x="307" y="182" text-anchor="middle" fill="#78350F">istatistik: Day-0 train</text>

    <rect x="420" y="105" width="165" height="110" rx="14" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
    <text x="502" y="140" text-anchor="middle" font-weight="700">Kanal yeniden</text>
    <text x="502" y="158" text-anchor="middle" font-weight="700">ölçekleme</text>
    <text x="502" y="180" text-anchor="middle">x' → Day-0 ölçeği</text>
    <text x="502" y="198" text-anchor="middle" fill="#78350F">hız λ_norm (kapılı)</text>

    <rect x="615" y="95" width="175" height="130" rx="16" fill="url(#core)" stroke="#92400E" stroke-width="2.5"/>
    <text x="702" y="128" text-anchor="middle" font-weight="700" font-size="15">Spike omurgası (plif)</text>
    <text x="702" y="152" text-anchor="middle">500 hızlı + 500 yavaş nöron</text>
    <text x="702" y="172" text-anchor="middle">τ_mem 4–40 / 40–400 ms</text>
    <text x="702" y="196" text-anchor="middle" font-size="12">çevrimdışı BPTT · çevrimiçi donuk</text>

    <rect x="820" y="105" width="165" height="110" rx="14" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
    <text x="902" y="140" text-anchor="middle" font-weight="700">5 başlıklı okuma</text>
    <text x="902" y="162" text-anchor="middle">τ = 16…160 ms</text>
    <text x="902" y="182" text-anchor="middle" fill="#78350F">çapalı NLMS (W_0)</text>

    <rect x="1015" y="105" width="155" height="110" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="1092" y="145" text-anchor="middle" font-weight="700">El hızı v̂(t)</text>
    <text x="1092" y="167" text-anchor="middle">(vx, vy)</text>
    <text x="1092" y="187" text-anchor="middle" fill="#78350F">R² (NeuroBench)</text>
  </g>
  <g stroke="#92400E" stroke-width="2.2" fill="none" marker-end="url(#ar)">
    <line x1="195" y1="160" x2="222" y2="160"/>
    <line x1="390" y1="160" x2="417" y2="160"/>
    <line x1="585" y1="160" x2="612" y2="160"/>
    <line x1="790" y1="160" x2="817" y2="160"/>
    <line x1="985" y1="160" x2="1012" y2="160"/>
  </g>

  <!-- modülasyon katmanı -->
  <rect x="200" y="300" width="330" height="125" rx="16" fill="url(#affect)" stroke="#B45309" stroke-width="2"/>
  <g font-size="13" fill="#422006">
    <text x="365" y="330" text-anchor="middle" font-weight="700" font-size="15">Kalıcı sürpriz sensörü</text>
    <text x="365" y="354" text-anchor="middle">donuk beyincik (ham x̄ tahmini) + girdi sapması</text>
    <text x="365" y="374" text-anchor="middle">taban Day-0'da sabit · tolerans zarfı</text>
    <text x="365" y="400" text-anchor="middle" fill="#78350F" font-style="italic">"bugün Day-0 değil" → 1–30 s içinde</text>
  </g>

  <rect x="610" y="300" width="380" height="125" rx="16" fill="url(#affect)" stroke="#B45309" stroke-width="2"/>
  <g font-size="13" fill="#422006">
    <text x="800" y="330" text-anchor="middle" font-weight="700" font-size="15">Duygu uzayı</text>
    <text x="800" y="356" text-anchor="middle"><tspan font-weight="700">arousal</tspan> (sensör) → gaz: η ≤ 3·η_0, g_fast / g_slow</text>
    <text x="800" y="378" text-anchor="middle"><tspan font-weight="700">dominans</tspan> (e_v düzeyi) → çapa gevşetme α</text>
    <text x="800" y="400" text-anchor="middle"><tspan font-weight="700">valens</tspan> (e_v eğilimi) → fren (aşırı gazda)</text>
  </g>

  <g stroke="#B45309" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arm)">
    <path d="M307,215 L307,297"/>
    <path d="M470,300 L470,218"/>
    <line x1="530" y1="362" x2="607" y2="362"/>
    <path d="M880,300 L880,218"/>
    <path d="M1092,215 L1092,362 L993,362"/>
  </g>
  <g font-size="12" fill="#92400E" font-weight="600">
    <text x="315" y="262">ham x̄</text>
    <text x="478" y="262">kapı → λ_norm</text>
    <text x="540" y="352">a_s</text>
    <text x="888" y="262">η(t) · α(t) · g</text>
    <text x="1100" y="290">500 ms gecikmeli</text>
    <text x="1100" y="306">etiket → e_v</text>
  </g>

  <!-- ilerleyiş -->
  <text x="40" y="490" font-size="18" font-weight="700" fill="#422006">İlerleyiş (test R²)</text>
  <line x1="40" y1="500" x2="1160" y2="500" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- grup 1: oturum içi, ölçek 1,0 = 200 px, taban y = 700 -->
  <text x="60" y="525" font-size="13" font-weight="700" fill="#78350F">Oturum içi (Indy / Loco ort.)</text>
  <g stroke="#E5C77A" stroke-width="1" font-size="10" fill="#92400E">
    <line x1="60" y1="700" x2="420" y2="700"/><text x="40" y="704">0</text>
    <line x1="60" y1="620" x2="420" y2="620" stroke-dasharray="2 4"/><text x="34" y="624">0,4</text>
    <line x1="60" y1="540" x2="420" y2="540" stroke-dasharray="2 4"/><text x="34" y="544">0,8</text>
  </g>
  <line x1="60" y1="584" x2="420" y2="584" stroke="#7C2D12" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="64" y="578" font-size="11" fill="#7C2D12">NeuroBench SNN 0,58</text>
  <rect x="80" y="619" width="80" height="81" rx="6" fill="#FEF3C7" stroke="#D97706"/>
  <rect x="190" y="558" width="80" height="142" rx="6" fill="#FCD34D" stroke="#B45309"/>
  <rect x="300" y="554" width="80" height="146" rx="6" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
  <g font-size="12" text-anchor="middle" fill="#422006">
    <text x="120" y="612" font-weight="700">0,40</text>
    <text x="230" y="551" font-weight="700">0,71</text>
    <text x="340" y="547" font-weight="700">0,73</text>
    <text x="120" y="755">v1 rezervuar</text>
    <text x="230" y="755">GRU tavanı</text>
    <text x="340" y="755">v2 omurga</text>
    <text x="120" y="772" fill="#78350F" font-size="11">20 ms</text>
    <text x="230" y="772" fill="#78350F" font-size="11">4 ms</text>
    <text x="340" y="772" fill="#78350F" font-size="11">4 ms, V3</text>
  </g>

  <!-- grup 2: günler arası Day-k, ölçek 0,1 = 50 px -->
  <text x="490" y="525" font-size="13" font-weight="700" fill="#78350F">Günler arası (Day-0 modeli, sonraki günler)</text>
  <g stroke="#E5C77A" stroke-width="1" font-size="10" fill="#92400E">
    <line x1="490" y1="700" x2="960" y2="700"/><text x="472" y="704">0</text>
    <line x1="490" y1="650" x2="960" y2="650" stroke-dasharray="2 4"/><text x="466" y="654">0,1</text>
    <line x1="490" y1="600" x2="960" y2="600" stroke-dasharray="2 4"/><text x="466" y="604">0,2</text>
    <line x1="490" y1="550" x2="960" y2="550" stroke-dasharray="2 4"/><text x="466" y="554">0,3</text>
  </g>
  <rect x="510" y="700" width="80" height="33" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-dasharray="4 3"/>
  <rect x="620" y="680" width="80" height="20" rx="6" fill="#FEF3C7" stroke="#D97706"/>
  <rect x="730" y="574" width="80" height="126" rx="6" fill="#FCD34D" stroke="#B45309"/>
  <rect x="840" y="560" width="80" height="140" rx="6" fill="#F59E0B" stroke="#92400E" stroke-width="2.5"/>
  <g font-size="12" text-anchor="middle" fill="#422006">
    <text x="550" y="694" font-weight="700">−0,07</text>
    <text x="660" y="674" font-weight="700">0,04</text>
    <text x="770" y="567" font-weight="700">0,25</text>
    <text x="880" y="553" font-weight="800" font-size="13">0,28</text>
    <text x="550" y="755">donuk (A)</text>
    <text x="660" y="755">okuma uyumu</text>
    <text x="770" y="755">sürekli ölçekleme</text>
    <text x="880" y="755" font-weight="700">sensör + duygu (D)</text>
    <text x="770" y="772" fill="#78350F" font-size="11">ilk günde −0,04</text>
    <text x="880" y="772" fill="#78350F" font-size="11">ilk gün korunur</text>
  </g>

  <!-- bulgu kartı -->
  <rect x="985" y="525" width="190" height="230" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <g font-size="12" fill="#422006">
    <text x="1080" y="552" text-anchor="middle" font-weight="700" font-size="14">Ana bulgu (V6)</text>
    <text x="1000" y="580">D &gt; okuma uyumu</text>
    <text x="1000" y="597" fill="#78350F">20/20, p &lt; 0,001</text>
    <text x="1000" y="622">D &gt; eşlenmiş sabit</text>
    <text x="1000" y="639" fill="#78350F">+0,007, p = 0,0008</text>
    <text x="1000" y="664">D ≈ karıştırılmış</text>
    <text x="1000" y="681" fill="#78350F">gün içi zamanlama değil,</text>
    <text x="1000" y="697" fill="#78350F">günü algılamak önemli</text>
    <text x="1000" y="725">Elektrot kaybı:</text>
    <text x="1000" y="742" fill="#78350F">sürekli ölçekleme önde</text>
  </g>
</svg>
